<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Card Maker — Shorts Reader</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#16181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --pit:#16181d; --pit-2:#1d2027; --edge:#2c313b; --edge-2:#363c48;
  --paper:#faf7f0; --ink:#1a1712; --ink-2:#4a453c; --ink-3:#8a8375;
  --amber:#e8a54b; --amber-deep:#c9822a; --amber-soft:#f6e6c8;
  --sage:#7fa894; --sage-deep:#4d7d64;
  --dust:#8b8f99; --dust-2:#5d626d;
  --occ-red:#d1493f; --occ-red-soft:#f7ddd8;
  --glow: 0 40px 90px -30px rgba(232,165,75,.20), 0 20px 50px -25px rgba(0,0,0,.7);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; touch-action:manipulation;}
body{ font-family:'Space Grotesk',system-ui,sans-serif; color:#e6e8ec;
  background:radial-gradient(140% 100% at 50% 8%, #1e2128 0%, var(--pit) 55%, #101216 100%);
  height:100dvh; overflow:hidden; -webkit-font-smoothing:antialiased; }
::selection{ background:var(--amber); color:var(--ink); }
button,input,textarea{ font-family:inherit; }
button{ cursor:pointer; border:none; background:none; color:inherit; }

.bench{ display:grid; grid-template-columns:236px 1fr; grid-template-rows:56px 1fr; height:100dvh; }

/* ---- top bar ---- */
.topbar{ grid-column:1 / -1; display:flex; align-items:center; gap:12px; padding:0 18px;
  background:rgba(255,255,255,.02); border-bottom:1px solid var(--edge); }
.topbar .logo{ width:26px; height:26px; border-radius:8px; background:var(--ink);
  border:1px solid var(--edge-2); position:relative; flex-shrink:0; }
.topbar .logo::before{ content:""; position:absolute; inset:6px 6px auto 6px; height:2px; background:var(--amber); border-radius:2px; box-shadow:0 0 8px var(--amber); }
.topbar h1{ font-family:'Newsreader',serif; font-weight:600; font-size:15px; color:#f3f4f6; flex-shrink:0; }
.topbar .spacer{ flex:1; }
.saveState{ font-family:'Space Mono',monospace; font-size:10.5px; color:var(--dust-2); display:flex; align-items:center; gap:6px; }
.saveState .dot{ width:6px; height:6px; border-radius:50%; background:var(--dust-2); }
.saveState.saved .dot{ background:var(--sage); }
.tbar-btn{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--dust);
  padding:8px 12px; border-radius:9px; border:1px solid var(--edge); transition:.13s; white-space:nowrap; }
.tbar-btn:hover{ border-color:var(--edge-2); color:#fff; background:var(--pit-2); }
.tbar-btn.warm{ background:var(--amber); color:var(--ink); border-color:var(--amber); font-weight:500; }
.tbar-btn.warm:hover{ background:#f0b25c; }
.tbar-btn svg{ width:14px; height:14px; }

/* ---- deck tray ---- */
.tray{ border-right:1px solid var(--edge); display:flex; flex-direction:column; min-height:0; background:rgba(0,0,0,.14); }
.tray-top{ padding:16px 16px 10px; }
.tray-top .kick{ font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dust-2); }
.deck-select{ display:block; width:100%; margin-top:6px; background:var(--pit-2); color:#f3f4f6; border:1px solid var(--edge); border-radius:8px; padding:7px 9px; font-family:'Space Grotesk',sans-serif; font-size:12.5px; }
.deck-select:focus{ outline:none; border-color:var(--amber-deep); }
input.deckName{ display:block; width:100%; margin-top:8px; background:transparent; border:none; color:#f3f4f6;
  font-family:'Newsreader',serif; font-size:19px; font-weight:600; letter-spacing:-.01em; }
input.deckName:focus{ outline:none; }
.tray-meta{ font-family:'Space Mono',monospace; font-size:10px; color:var(--dust-2); margin-top:5px; }

.spines{ flex:1; overflow-y:auto; padding:4px 12px 12px; }
.spines::-webkit-scrollbar{ width:8px; } .spines::-webkit-scrollbar-thumb{ background:var(--edge); border-radius:8px; }
.spine{ position:relative; display:flex; gap:11px; padding:11px 11px 11px 13px; border-radius:11px; cursor:pointer;
  margin-bottom:4px; border:1px solid transparent; }
.spine:hover{ background:var(--pit-2); }
.spine.on{ background:linear-gradient(90deg, rgba(232,165,75,.14), rgba(232,165,75,.03)); border-color:rgba(232,165,75,.35); }
.spine .rib{ position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:0 3px 3px 0; background:var(--edge-2); }
.spine.on .rib{ background:var(--amber); box-shadow:0 0 10px var(--amber); }
.spine .s-num{ font-family:'Space Mono',monospace; font-size:10.5px; color:var(--dust-2); padding-top:2px; min-width:16px; }
.spine.on .s-num{ color:var(--amber); }
.spine .s-body{ min-width:0; flex:1; }
.spine .s-title{ font-family:'Newsreader',serif; font-size:14px; line-height:1.28; color:#e9eaee; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.spine .s-title.empty{ color:var(--dust-2); font-style:italic; }
.spine .s-meta{ display:flex; gap:6px; margin-top:4px; }
.spine .s-tag{ font-family:'Space Mono',monospace; font-size:8.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--amber-deep); }
.spine .s-flag{ display:inline-flex; align-items:center; gap:3px; font-family:'Space Mono',monospace; font-size:8.5px; color:var(--occ-red); }
.spine .s-flag svg{ width:9px; height:9px; }
.spine .s-del{ opacity:0; flex-shrink:0; width:22px; height:22px; border-radius:7px; color:var(--dust-2); display:flex; align-items:center; justify-content:center; align-self:flex-start; }
.spine:hover .s-del{ opacity:1; }
.spine .s-del:hover{ color:var(--occ-red); background:rgba(209,73,63,.12); }

.tray-actions{ display:flex; flex-direction:column; gap:7px; padding:0 12px 14px; flex-shrink:0; }
.tray-actions button{ display:flex; align-items:center; justify-content:center; gap:8px; padding:11px; border-radius:11px;
  border:1px dashed var(--edge-2); color:var(--dust); font-size:12.5px; transition:.13s; }
.tray-actions button:hover{ border-color:var(--amber); color:var(--amber); }
.tray-actions button svg{ width:15px; height:15px; }

/* ---- stage ---- */
.stage{ position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.stage::before{ content:""; position:absolute; width:620px; height:620px; border-radius:50%;
  background:radial-gradient(circle, rgba(232,165,75,.10), transparent 62%); top:46%; left:50%; transform:translate(-50%,-50%); pointer-events:none; }
.readout{ position:absolute; top:18px; left:50%; transform:translateX(-50%); display:flex; gap:15px;
  font-family:'Space Mono',monospace; font-size:10px; color:var(--dust-2); letter-spacing:.03em; z-index:5; }
.readout b{ color:var(--dust); font-weight:400; }
.modeswitch{ position:absolute; top:14px; right:18px; z-index:5; display:flex; background:var(--pit-2);
  border:1px solid var(--edge); border-radius:9px; padding:2px; }
.modeswitch button{ font-size:11px; padding:6px 10px; border-radius:7px; color:var(--dust); font-family:'Space Mono',monospace; }
.modeswitch button.on{ background:var(--amber); color:var(--ink); font-weight:500; }

.card{ width:452px; max-width:calc(100vw - 400px); background:var(--paper); border-radius:18px; box-shadow:var(--glow);
  position:relative; padding:34px 32px 28px; max-height:calc(100dvh - 116px); overflow-y:auto; overflow-x:hidden; }
.card::-webkit-scrollbar{ width:9px; } .card::-webkit-scrollbar-thumb{ background:#e3ddcf; border-radius:9px; }
.c-eyebrow{ display:flex; align-items:center; gap:9px; margin-bottom:15px; }
.c-tag{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--amber-deep); border:1px solid var(--amber-deep); border-radius:5px; padding:3px 8px 2px; }
.c-tag.ghost{ color:var(--ink-3); border-color:#dcd5c6; border-style:dashed; }
.c-num{ font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-3); margin-left:auto; }
[contenteditable]{ outline:none; }
.c-title{ font-family:'Newsreader',serif; font-weight:600; font-size:27px; line-height:1.18; letter-spacing:-.015em; color:var(--ink); margin-bottom:15px; caret-color:var(--amber-deep); }
.c-title:empty::before{ content:"Untitled card"; color:#d8d1c2; }
.c-body{ font-family:'Newsreader',serif; font-size:16.5px; line-height:1.6; color:#2a251d; caret-color:var(--amber-deep); min-height:120px; }
.c-body:empty::before{ content:"Write the card. Select text to format \00b7 press / for a block \00b7 select \2192 Occlude to hide an answer."; color:#d0c9ba; }
.c-body p{ margin:0 0 13px; } .c-body p:last-child{ margin-bottom:0; }
.c-body strong{ color:var(--amber-deep); font-weight:700; }
.c-body em{ color:#3d6b57; font-style:italic; }
.c-body mark{ background:var(--amber-soft); color:var(--ink); padding:1px 4px; border-radius:3px; }
.c-body code{ font-family:'Space Mono',monospace; font-size:.82em; background:#efe9db; padding:2px 6px; border-radius:4px; color:#a5641c; }
.c-body u{ text-decoration:underline; text-decoration-color:var(--amber-deep); text-underline-offset:2px; }
.c-body a{ color:var(--sage-deep); text-decoration:underline; }
.c-body ul, .c-body ol{ margin:2px 0 13px; padding-left:22px; }
.c-body li{ margin:5px 0; } .c-body li::marker{ color:var(--amber-deep); }
.c-body h3{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12.5px; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-2); margin:15px 0 8px; }
.c-body blockquote{ margin:9px 0 13px; padding:5px 0 5px 13px; border-left:3px solid var(--amber); color:var(--ink-2); font-style:italic; }
.c-body table{ border-collapse:collapse; font-size:14px; width:100%; margin:8px 0 13px; }
.c-body th, .c-body td{ border:1px solid #e2dccd; padding:8px 10px; text-align:left; vertical-align:top; }
.c-body th{ background:#f2ecdd; font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:600; letter-spacing:.02em; color:var(--ink-2); }
.c-body figure{ margin:9px 0 13px; border-radius:11px; overflow:hidden; border:1px solid #e2dccd; }
.c-body figure img{ display:block; width:100%; height:auto; }
.c-body figure figcaption{ padding:7px 11px; font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-3); border-top:1px solid #e2dccd; background:#f4efe3; }
.c-body .fig-ref{ display:inline-flex; align-items:center; gap:6px; font-family:'Space Mono',monospace; font-size:11px; color:var(--amber-deep); border:1px solid rgba(201,130,42,.35); border-radius:9px; padding:6px 10px; margin:4px 0; background:rgba(201,130,42,.06); }

/* occlusion chip — visible marked answer, not {{ }} */
.occ-chip{ display:inline-block; background:var(--amber-soft); color:var(--amber-deep); border:1px solid var(--amber-deep);
  border-radius:5px; padding:0 6px; margin:0 1px; font-weight:600; cursor:default; line-height:1.4; }
.occ-chip::before{ content:"\25C8"; font-size:.7em; margin-right:3px; opacity:.6; }
.occ-chip.flagged{ border-color:var(--occ-red); background:var(--occ-red-soft); color:#8a2e26; }

.card-imgbtn{ position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:9px;
  background:#fff; border:1px solid #e6e0d1; color:var(--ink-3); display:flex; align-items:center; justify-content:center; }
.card-imgbtn:hover{ border-color:var(--amber-deep); color:var(--amber-deep); }
.card-imgbtn svg{ width:16px; height:16px; }

/* raw MD editor surface */
.md-area{ width:100%; min-height:280px; resize:vertical; font-family:'Space Mono',monospace; font-size:13.5px;
  line-height:1.65; border:1px solid #e2dccd; border-radius:12px; padding:14px 15px; background:#fbf9f3; color:#2a251d;
  display:block; caret-color:var(--amber-deep); }
.md-area:focus{ outline:none; border-color:var(--amber-deep); }

/* detachable vertical floating palette */
.palette{ position:absolute; z-index:44; left:14px; top:50%; transform:translateY(-50%); display:flex;
  flex-direction:column; align-items:center; gap:3px; padding:6px; width:46px; background:#0f1115;
  border:1px solid var(--edge-2); border-radius:14px; box-shadow:0 18px 40px -14px rgba(0,0,0,.7); }
.palette.dragging{ opacity:.92; }
.pal-grip{ width:34px; height:20px; border-radius:7px; color:var(--dust-2); display:flex; align-items:center; justify-content:center; cursor:grab; }
.pal-grip:active{ cursor:grabbing; } .pal-grip:hover{ color:var(--dust); background:var(--pit-2); }
.pal-btn{ width:34px; height:34px; border-radius:9px; color:#c6cad2; display:flex; align-items:center; justify-content:center; font-size:14px; transition:.12s; position:relative; }
.pal-btn:hover{ background:var(--pit-2); color:#fff; } .pal-btn:active{ transform:scale(.9); }
.pal-btn b{ font-family:'Newsreader',serif; font-weight:700; } .pal-btn i{ font-family:'Newsreader',serif; font-style:italic; }
.pal-btn .mono{ font-family:'Space Mono',monospace; font-size:12px; }
.pal-btn .mk{ font-family:'Newsreader',serif; font-weight:600; background:var(--amber); color:var(--ink); border-radius:3px; padding:0 3px; font-size:12px; }
.pal-sep{ width:24px; height:1px; background:var(--edge); margin:3px 0; }
.pal-btn[data-tip]:hover::after{ content:attr(data-tip); position:absolute; left:44px; top:50%; transform:translateY(-50%);
  background:#0f1115; border:1px solid var(--edge-2); color:#e6e8ec; font-size:11px; padding:5px 9px; border-radius:7px;
  white-space:nowrap; z-index:90; box-shadow:0 8px 20px -8px rgba(0,0,0,.7); pointer-events:none; }

/* floating format bar on selection */
.floatbar{ position:absolute; z-index:50; display:none; align-items:center; gap:2px; background:#0f1115;
  border:1px solid var(--edge-2); border-radius:11px; padding:5px; box-shadow:0 16px 36px -12px rgba(0,0,0,.8); transform:translate(-50%,-13px); }
.floatbar.show{ display:flex; }
.floatbar::after{ content:""; position:absolute; left:50%; bottom:-5px; transform:translateX(-50%) rotate(45deg);
  width:9px; height:9px; background:#0f1115; border-right:1px solid var(--edge-2); border-bottom:1px solid var(--edge-2); }
.fb{ min-width:30px; height:30px; padding:0 8px; border-radius:7px; color:#c6cad2; display:inline-flex;
  align-items:center; justify-content:center; font-size:13px; transition:.12s; }
.fb:hover{ background:var(--pit-2); color:#fff; } .fb.on{ background:var(--amber); color:var(--ink); }
.fb b{ font-family:'Newsreader',serif; font-weight:700; } .fb i{ font-family:'Newsreader',serif; font-style:italic; }
.fb .mono{ font-family:'Space Mono',monospace; font-size:12px; }
.fb-sep{ width:1px; height:18px; background:var(--edge-2); margin:0 3px; }

/* slash menu */
.slash{ position:absolute; z-index:55; display:none; width:236px; background:var(--pit-2); border:1px solid var(--edge-2);
  border-radius:13px; box-shadow:0 20px 44px -16px rgba(0,0,0,.75); padding:6px; }
.slash.show{ display:block; }
.slash .kick{ font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.1em; color:var(--dust-2); padding:7px 9px 5px; text-transform:uppercase; }
.si{ display:flex; align-items:center; gap:11px; padding:8px 9px; border-radius:9px; cursor:pointer; }
.si:hover{ background:var(--pit); }
.si-ic{ width:30px; height:30px; border-radius:8px; background:var(--pit); border:1px solid var(--edge); display:flex; align-items:center; justify-content:center; color:var(--dust); flex-shrink:0; }
.si:hover .si-ic{ border-color:var(--amber-deep); color:var(--amber); }
.si-ic svg{ width:16px; height:16px; } .si-ic .mono{ font-family:'Space Mono',monospace; font-size:13px; }
.si-name{ font-size:13px; font-weight:500; color:#e9eaee; } .si-desc{ font-size:11px; color:var(--dust-2); margin-top:1px; }

/* import/export modal */
.modal{ position:fixed; inset:0; z-index:150; background:rgba(8,9,11,.7); display:none; align-items:center; justify-content:center; padding:20px; }
.modal.show{ display:flex; }
.modal-box{ width:100%; max-width:480px; background:var(--pit-2); border:1px solid var(--edge-2); border-radius:16px; padding:22px; box-shadow:0 30px 60px -24px rgba(0,0,0,.8); }
.modal-box h3{ font-family:'Newsreader',serif; font-weight:600; font-size:20px; margin-bottom:6px; }
.modal-box .msub{ font-size:12.5px; color:var(--dust); line-height:1.55; margin-bottom:16px; }
.modal-box .msub code{ font-family:'Space Mono',monospace; font-size:.9em; background:var(--pit); padding:1px 5px; border-radius:4px; color:var(--amber); }
.modal-box .mlabel{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--dust-2); margin:14px 0 7px; }
.modal-box .mta{ width:100%; min-height:130px; resize:vertical; background:var(--pit); border:1px solid var(--edge); border-radius:10px; padding:11px 13px; color:#e6e8ec; font-family:'Space Mono',monospace; font-size:12.5px; line-height:1.5; }
.modal-box .mta:focus{ outline:none; border-color:var(--amber-deep); }
.modal-box .mrow{ margin-top:12px; } .modal-box .mcheck{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--dust); }
.modal-box .mactions{ display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
.mbtn{ font-size:12.5px; padding:9px 14px; border-radius:9px; border:1px solid var(--edge-2); color:var(--dust); background:transparent; transition:.13s; }
.mbtn:hover{ color:#fff; background:var(--pit); }
.mbtn.full{ width:100%; justify-content:center; }
.mbtn.prime{ background:var(--amber); color:var(--ink); border-color:var(--amber); font-weight:500; }
.mbtn.prime:hover{ background:#f0b25c; }

.empty-card{ color:var(--ink-3); font-family:'Space Grotesk',sans-serif; padding:20px; text-align:center; }

@media (max-width:900px){
  .bench{ grid-template-columns:1fr; grid-template-rows:56px 1fr; }
  .tray{ display:none; }
  .card{ max-width:calc(100vw - 40px); }
  .palette{ left:6px; }
}
</style>
</head>
<body>
<div class="bench" id="bench"></div>
<div class="modal" id="modal"></div>

<script>
/* ============================================================================
   BORESCROLL STORAGE — IndexedDB, replacing the old single localStorage blob.

   Why: localStorage tops out around 5-10MB per origin, and decks embed images
   as base64 text, which blows through that fast (base64 also inflates raw
   image bytes by ~33% for nothing). IndexedDB's quota is tied to available
   disk (commonly hundreds of MB to several GB), stores Blobs natively, and
   every read/write is async so a big save never blocks the scroll/typing.

   Two object stores:
     "decks"  -> one record per deck (title, cards, pos, wrongLedger,
                 supplements, etc.) — everything EXCEPT embedded image bytes.
     "images" -> one record per embedded image, holding the raw Blob. Keyed
                 by a composite "<deckTitle>::<tokenKey>" id so the same
                 short token (img1, img2, ...) can be reused independently
                 across different decks without colliding.

   Card bodies keep referencing images the same way they always have —
   ![alt](#imgKey) — nothing about the markdown/authoring format changes.
   Only WHERE the bytes live and HOW they're fetched changes (async now).
   ========================================================================= */
(function (root) {
  'use strict';

  var DB_NAME = 'boreScrollDB';
  var DB_VERSION = 2; // v2 adds the "folders" store
  var dbPromise = null;

  function openDB(){
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('decks')) db.createObjectStore('decks', { keyPath: 'title' });
        if (!db.objectStoreNames.contains('images')) db.createObjectStore('images', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('folders')) db.createObjectStore('folders', { keyPath: 'id' });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbPromise;
  }
  function idbPut(store, value){
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(value);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function idbGet(store, key){
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(store, 'readonly');
        var req = tx.objectStore(store).get(key);
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }
  function idbGetAll(store){
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(store, 'readonly');
        var req = tx.objectStore(store).getAll();
        req.onsuccess = function () { resolve(req.result || []); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }
  function idbGetAllKeys(store){
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(store, 'readonly');
        var req = tx.objectStore(store).getAllKeys();

  var LEGACY_LIBRARY_KEY = 'shorts-reader:library';

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  var escAttr = function(s){ return esc(s).replace(/"/g,'&quot;'); };

  /* ============================================================================

     the same decks live. No separate "card-maker" database.
     ========================================================================= */

  function migrateEntry(entry){
    var changed=false;
    if(!entry.wrongLedger){ entry.wrongLedger=[]; changed=true; }

  }

  /* ============================================================================

      if(isFigRef(m[1])) continue;

      var answer=(m[1]||'').trim(), hint=m[2]!=null?m[2].trim():'';

      segments.push({type:'occ', key:key, answer:answer, hint:hint, ordinal:ordinal});
      ordinal++; last=OCC_RE.lastIndex;

     italic *, highlight ==, underline __, code `, links), so what you see

    o=o.replace(/`([^`]+)`/g,'<code>$1</code>');
    o=o.replace(/\*(.+?)\*/g,'<em>$1</em>');

  }

    var withS=s.replace(/\{\{([^{}|]+?)(?:\|([^{}]*?))?\}\}/g, function(m,a,h){

    html=html.replace(/\u0000K(\d+)\u0000/g, function(m,ix){
      var c=chips[+ix];

      return '<span class="occ-chip'+(flagged?' flagged':'')+'" data-a="'+escAttr(c.a)+'"'+(c.h?' data-h="'+escAttr(c.h)+'"':'')+' contenteditable="false">'+esc(c.a)+'</span>';

        var cap = alt ? '<figcaption contenteditable="false">'+esc(alt)+'</figcaption>' : '';

      var ls=c.split('\n').filter(function(l){return l.trim().length;});

      if(ls.length&&ls.every(function(l){return /^\s*>\s?/.test(l);})) return '<blockquote>'+ls.map(function(l){return inlineWithOcc(l.replace(/^\s*>\s?/,''), card, entry);}).join('<br>')+'</blockquote>';
      return '<p>'+ls.map(function(l){return inlineWithOcc(l, card, entry);}).join('<br>')+'</p>';
    }).join('');
  }
  function tableHtml(header, rows, card, entry){
    return '<table><thead><tr>'+header.map(function(h){return '<th>'+inlineWithOcc(h, card, entry)+'</th>';}).join('')+'</tr></thead><tbody>'+
      rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inlineWithOcc(c, card, entry)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
  }

  var BLOCK_TAGS = {p:1,h3:1,h2:1,h4:1,ul:1,ol:1,blockquote:1,hr:1,figure:1,table:1,div:1};
  // Groups any run of top-level nodes that ISN'T a recognized block element
  // (bare text typed into an empty contenteditable, an occlusion chip that
  // ended up outside a <p>, stray inline tags) into an implicit paragraph,
  // rather than treating every such node as its own block — which is what
  // browsers actually produce when you start typing into an empty surface.
  function editHtmlToMd(rootEl, images){

      runNodes.forEach(function(n){ tmp.appendChild(n.cloneNode(true)); });
      var md=inlineNodeMd(tmp, images);
      if(md) blocks.push(md);

      var isBlock = node.nodeType===1 && BLOCK_TAGS[node.tagName.toLowerCase()];
      if(isBlock){ flushRun(); var md=blockToMd(node, images); if(md!=null && md!=='') blocks.push(md); }
      else { runNodes.push(node); }
    });

  }
  function blockToMd(node, images){
    if(node.nodeType===3){ var t=node.textContent.trim(); return t?t:''; }
    if(node.nodeType!==1) return '';
    var tag=node.tagName.toLowerCase();
    switch(tag){
      case 'p': return inlineNodeMd(node, images);
      case 'h3': case 'h2': case 'h4': return '### '+inlineNodeMd(node, images);
      case 'ul': return listMd(node,'ul', images);
      case 'ol': return listMd(node,'ol', images);
      case 'blockquote': return blockquoteMd(node, images);
      case 'hr': return '---';
      case 'figure': return figureMd(node, images);
      case 'table': return tableMd(node, images);
      case 'div':
        if(node.classList && node.classList.contains('fig-ref')){
          var txt=node.textContent.replace(/^\s*\uD83D\uDCD6\s*See\s*/,'').replace(/\s*in the textbook\s*$/,'').trim();

    var out='';
    Array.prototype.forEach.call(node.childNodes, function(ch){ out+=inlineChildMd(ch, images); });
    return out.replace(/[ \t]+\n/g,'\n').trim();
  }
  function inlineChildMd(ch, images){
    if(ch.nodeType===3) return ch.textContent;
    if(ch.nodeType!==1) return '';
    var tag=ch.tagName.toLowerCase();
    if(tag==='br') return '\n';
    if(ch.classList && ch.classList.contains('occ-chip')){
      var a=ch.getAttribute('data-a')||ch.textContent, h=ch.getAttribute('data-h');
      return h ? '{{'+a+'|'+h+'}}' : '{{'+a+'}}';
    }

    switch(tag){
      case 'strong': case 'b': return '**'+inner+'**';
      case 'em': case 'i': return '*'+inner+'*';
      case 'mark': return '=='+inner+'==';
      case 'code': return '`'+inner+'`';
      case 'u': return '__'+inner+'__';
      case 'a': return '['+inner+']('+(ch.getAttribute('href')||'')+')';
      default: return inner;
    }
  }
  function listMd(node,type,images){
    var items=Array.prototype.slice.call(node.children).filter(function(c){return c.tagName.toLowerCase()==='li';});
    return items.map(function(li,i){ var pre=type==='ol'?(i+1)+'. ':'- '; return pre+inlineNodeMd(li, images); }).join('\n');
  }
  function blockquoteMd(node, images){
    return inlineNodeMd(node, images).split('\n').map(function(l){return '> '+l;}).join('\n');
  }
  function figureMd(node){
    var img=node.querySelector('img'); if(!img) return '';
    var cap=node.querySelector('figcaption'), alt=cap?cap.textContent.trim():(img.getAttribute('alt')||'');

    // display-time resolver (which only ever rewrites img.src), so it's
    // always the canonical reference to save — #tokenKey or a real url.

  }
  function tableMd(node, images){
    var headCells=node.querySelectorAll('thead th');
    var header=Array.prototype.map.call(headCells, function(th){return inlineNodeMd(th, images)||' ';});
    if(!header.length){ var firstTr=node.querySelector('tr'); if(firstTr) header=Array.prototype.map.call(firstTr.children,function(td){return inlineNodeMd(td, images)||' ';}); }

  // Images are referenced in card markdown as #tokenKey and rendered with
  // that literal src by mdToEditHtml — resolving the real bytes is a
  // separate async step since they live in IndexedDB, not inline as base64.
  // Cached in memory so repeat renders of the same card don't re-fetch.
  var imgUrlCache = {}; // "deckTitle::key" -> objectURL string | null
  function resolveCardImages(rootEl, deckTitle){
    if (!rootEl || !deckTitle) return Promise.resolve();
    var imgs = rootEl.querySelectorAll('img[src^="#"]');
    var chain = Promise.resolve();
    Array.prototype.forEach.call(imgs, function(imgEl){
      var key = imgEl.getAttribute('src').slice(1);
      if (!key) return;
      var cacheKey = deckTitle + '::' + key;
      chain = chain.then(function(){
        if (Object.prototype.hasOwnProperty.call(imgUrlCache, cacheKey)){
          var cached = imgUrlCache[cacheKey];
          if (cached) imgEl.src = cached; else { var fig=imgEl.closest('figure'); if(fig) fig.style.display='none'; }
          return;
        }
        return BoreStorage.getImage(deckTitle, key).then(function(rec){
          var url = (rec && rec.blob) ? URL.createObjectURL(rec.blob) : null;
          imgUrlCache[cacheKey] = url;
          if (url) imgEl.src = url; else { var fig=imgEl.closest('figure'); if(fig) fig.style.display='none'; }
        }).catch(function(){ imgUrlCache[cacheKey] = null; var fig=imgEl.closest('figure'); if(fig) fig.style.display='none'; });
      });
    });
    return chain;
  }

  /* ============================================================================

  function wireTitle(){
    var t=$('title'); if(!t) return;
    t.addEventListener('input', function(){ currentCard().title=t.textContent; syncSpineTitle(); scheduleSave(); });
    var tagBtn=$('tagBtn'); if(tagBtn) tagBtn.onclick=editTag;
    var imgBtn=$('imgBtn'); if(imgBtn) imgBtn.onclick=pickImage;
  }
  function syncSpineTitle(){ var s=$('spines').querySelector('.spine.on .s-title'); if(!s) return; var v=currentCard().title.trim(); s.textContent=v||'Untitled card'; s.classList.toggle('empty',!v); }
  function editTag(){ var v=prompt('Section tag (blank to remove):', currentCard().tag||''); if(v===null) return; currentCard().tag=v.trim(); scheduleSave(); renderSpines(); renderCard(); }

  function wireWysiwyg(){
    var body=$('body'); if(!body) return;
    body.addEventListener('input', commitWysiwyg);
    body.addEventListener('keydown', wysiwygKeys);
    body.addEventListener('blur', function(){ setTimeout(hideFloatbar,150); });
    body.addEventListener('click', function(e){ var img=e.target.closest('figure img'); if(img) img.parentElement.classList.toggle('sel'); });
  }
  function commitWysiwyg(){ var body=$('body'); if(!body) return; var clone=body.cloneNode(true);
    currentCard().body = editHtmlToMd(clone); scheduleSave(); }
  function wysiwygKeys(e){
    if((e.ctrlKey||e.metaKey)&&!e.altKey){ var k=e.key.toLowerCase();
      if(k==='b'){ e.preventDefault(); execWrap('bold'); } else if(k==='i'){ e.preventDefault(); execWrap('italic'); }
      else if(k==='e'){ e.preventDefault(); execWrap('mark'); } else if(k==='`'){ e.preventDefault(); execWrap('code'); }
      else if(k==='o'){ e.preventDefault(); occludeSelection(); } }
    if(e.key==='/'){ setTimeout(showSlash,0); } else if(e.key==='Escape'){ hideSlash(); }
  }
  function execWrap(kind){ var body=$('body'); if(!body) return; body.focus();
    if(kind==='bold') document.execCommand('bold');
    else if(kind==='italic') document.execCommand('italic');
    else if(kind==='code') toggleWrapTag('code');
    else if(kind==='mark') toggleWrapTag('mark');
    commitWysiwyg(); }
  function toggleWrapTag(tag){ var sel=window.getSelection(); if(!sel.rangeCount||sel.isCollapsed) return; var r=sel.getRangeAt(0);
    var anc=r.commonAncestorContainer, host=anc.nodeType===1?anc:anc.parentNode, existing=host.closest&&host.closest(tag);
    if(existing && sel.toString().trim()===existing.textContent.trim()){ var p=existing.parentNode; while(existing.firstChild) p.insertBefore(existing.firstChild, existing); p.removeChild(existing); }
    else { var el=document.createElement(tag); try{ el.appendChild(r.extractContents()); r.insertNode(el); sel.removeAllRanges(); var nr=document.createRange(); nr.setStartAfter(el); nr.collapse(true); sel.addRange(nr); }catch(_){ } }
  }
  function occludeSelection(){
    var body=$('body'); if(!body) return; body.focus();
    var sel=window.getSelection(); if(!sel.rangeCount) return;
    var text=sel.toString().trim(); if(!text) text='answer';
    var r=sel.getRangeAt(0);
    var chip=document.createElement('span'); chip.className='occ-chip'; chip.setAttribute('data-a', text); chip.setAttribute('contenteditable','false'); chip.textContent=text;
    try{ r.deleteContents(); r.insertNode(chip); sel.removeAllRanges(); var nr=document.createRange(); nr.setStartAfter(chip); nr.collapse(true); sel.addRange(nr); }catch(_){ }
    commitWysiwyg();
  }
  function insertBlockWysiwyg(kind){
    var body=$('body'); if(!body) return; body.focus(); var node;
    if(kind==='ul'||kind==='ol'){ node=document.createElement(kind==='ul'?'ul':'ol'); ['item one','item two','item three'].forEach(function(x){ var li=document.createElement('li'); li.textContent=x; node.appendChild(li); }); }
    else if(kind==='quote'){ node=document.createElement('blockquote'); node.textContent='quoted line'; }
    else if(kind==='h3'){ node=document.createElement('h3'); node.textContent='Sub-heading'; }
    else if(kind==='table'){ node=buildTableNode(['Feature','A','B'],[['\u2014','\u2014','\u2014'],['\u2014','\u2014','\u2014']]); }
    else if(kind==='fig'){ var label=prompt('Figure label (e.g. "Fig 7.4"):','Fig '); if(!label) return; node=document.createElement('div'); node.className='fig-ref'; node.setAttribute('contenteditable','false'); node.textContent='\uD83D\uDCD6 See '+label+' in the textbook'; }
    if(!node) return;
    insertNodeAtCaret(node); commitWysiwyg(); renderCard();
  }
  function buildTableNode(header, rows){
    var t=document.createElement('table'), thead=document.createElement('thead'), htr=document.createElement('tr');
    header.forEach(function(h){ var th=document.createElement('th'); th.textContent=h; htr.appendChild(th); }); thead.appendChild(htr); t.appendChild(thead);
    var tb=document.createElement('tbody'); rows.forEach(function(r){ var tr=document.createElement('tr'); r.forEach(function(c){ var td=document.createElement('td'); td.textContent=c; tr.appendChild(td); }); tb.appendChild(tr); }); t.appendChild(tb);
    return t;
  }
  function insertNodeAtCaret(node){
    var sel=window.getSelection(), body=$('body'); if(!body) return;
    if(sel.rangeCount && body.contains(sel.anchorNode)){
      var r=sel.getRangeAt(0);
      // Inserting a block element (list/quote/heading/etc) while the caret is
      // inside a <table> cell corrupts the table in contenteditable — land it
      // after the table instead, which is what the user actually wants.
      var anc=r.commonAncestorContainer, host=anc.nodeType===1?anc:anc.parentNode;
      var tableAncestor = host && host.closest ? host.closest('table') : null;
      if(tableAncestor && tableAncestor.parentNode===body){
        body.insertBefore(node, tableAncestor.nextSibling);
        return;
      }
      if(tableAncestor){ tableAncestor.parentNode.insertBefore(node, tableAncestor.nextSibling); return; }
      r.collapse(false); r.insertNode(node);
    } else body.appendChild(node);
  }

  function wireMdArea(){
    var ta=$('mdArea'); if(!ta) return;
    ta.addEventListener('input', function(){ currentCard().body=ta.value; scheduleSave(); });
    ta.addEventListener('keydown', function(e){
      if((e.ctrlKey||e.metaKey)&&!e.altKey){ var k=e.key.toLowerCase();
        if(k==='b'){ e.preventDefault(); wrapMd('**','**'); } else if(k==='i'){ e.preventDefault(); wrapMd('*','*'); }
        else if(k==='e'){ e.preventDefault(); wrapMd('==','=='); } else if(k==='o'){ e.preventDefault(); wrapMd('{{','}}'); } }
      if(e.key==='Tab'){ e.preventDefault(); insertMd('  '); }
    });
  }
  function wrapMd(a,b){ var ta=$('mdArea'); if(!ta) return; var s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.slice(s,e)||''; ta.value=ta.value.slice(0,s)+a+sel+b+ta.value.slice(e); ta.selectionStart=s+a.length; ta.selectionEnd=s+a.length+sel.length; ta.focus(); currentCard().body=ta.value; scheduleSave(); }
  function insertMd(t){ var ta=$('mdArea'); if(!ta) return; var s=ta.selectionStart; ta.value=ta.value.slice(0,s)+t+ta.value.slice(ta.selectionEnd); ta.selectionStart=ta.selectionEnd=s+t.length; ta.focus(); currentCard().body=ta.value; scheduleSave(); }

  function dispatchCmd(cmd){
    if(!currentCard()) return;
    if(state.editMode==='md'){
      switch(cmd){ case 'bold': return wrapMd('**','**'); case 'italic': return wrapMd('*','*'); case 'mark': return wrapMd('==','=='); case 'code': return wrapMd('`','`'); case 'occlude': return wrapMd('{{','}}');
        case 'h3': return insertMd('\n### Sub-heading\n'); case 'ul': return insertMd('\n- item one\n- item two\n'); case 'ol': return insertMd('\n1. first\n2. second\n'); case 'quote': return insertMd('\n> quoted line\n');
        case 'table': return insertMd('\n| Feature | A | B |\n|---|---|---|\n| \u2014 | \u2014 | \u2014 |\n'); case 'image': return pickImage();
        case 'fig': var label=prompt('Figure label (e.g. "Fig 7.4"):','Fig '); if(label) insertMd('\n{{fig: '+label+'}}\n'); return; }
      return;
    }
    switch(cmd){ case 'bold': case 'italic': case 'mark': case 'code': return execWrap(cmd); case 'occlude': return occludeSelection();
      case 'h3': case 'ul': case 'ol': case 'quote': case 'table': case 'fig': return insertBlockWysiwyg(cmd); case 'image': return pickImage(); }
  }

  function updateFloatbar(){
    if(state.editMode!=='visual'||!currentCard()){ hideFloatbar(); return; }
    var body=$('body'); if(!body) return;
    var sel=window.getSelection();
    if(!sel.rangeCount||sel.isCollapsed||!body.contains(sel.anchorNode)){ hideFloatbar(); return; }
    var r=sel.getRangeAt(0).getBoundingClientRect(), st=$('stage').getBoundingClientRect();
    var fb=$('floatbar'); fb.style.left=(r.left+r.width/2-st.left)+'px'; fb.style.top=(r.top-st.top)+'px'; fb.classList.add('show');
  }
  function hideFloatbar(){ var fb=$('floatbar'); if(fb) fb.classList.remove('show'); }
  function showSlash(){ var sel=window.getSelection(); if(!sel.rangeCount) return; var r=sel.getRangeAt(0).getBoundingClientRect(), st=$('stage').getBoundingClientRect(); var sm=$('slash'); sm.style.left=(r.left-st.left)+'px'; sm.style.top=(r.bottom-st.top+6)+'px'; sm.classList.add('show'); }
  function hideSlash(){ var sm=$('slash'); if(sm) sm.classList.remove('show'); }

  /* ============================================================================
     IMAGE EMBEDDING — stores a short token (#tokenKey) in card markdown; the
     actual bytes live in IndexedDB as a Blob, not inline as base64 text.
     Lossless where practical: JPEG/PNG under ~700KB pass through with their
     original bytes untouched; anything larger is downscaled via canvas;
     other formats are decoded once and re-encoded as PNG.
     ========================================================================= */
  function pickImage(){
    var input=document.createElement('input'); input.type='file'; input.accept='image/*';
    input.onchange=function(){ var f=input.files[0]; if(f) embedImageFile(f); };
    input.click();
  }
  function processImageFile(file){
    var type=(file.type||'').toLowerCase();
    var isJpegPng = type==='image/jpeg' || type==='image/jpg' || type==='image/png';
    if(isJpegPng && file.size<=700*1024){
      return (window.createImageBitmap ? createImageBitmap(file).then(function(bmp){ var d={width:bmp.width,height:bmp.height}; if(bmp.close) bmp.close(); return d; }).catch(function(){ return {width:null,height:null}; }) : Promise.resolve({width:null,height:null}))
        .then(function(dims){ return { blob:file, type:file.type||(type==='image/jpg'?'image/jpeg':type), width:dims.width, height:dims.height }; });
    }
    if(!window.createImageBitmap) return Promise.resolve({ blob:file, type:file.type, width:null, height:null });
    return createImageBitmap(file).then(function(bmp){
      var maxDim=1280, scale=Math.min(1, maxDim/Math.max(bmp.width,bmp.height));
      var w=Math.max(1,Math.round(bmp.width*scale)), h=Math.max(1,Math.round(bmp.height*scale));
      var canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(bmp,0,0,w,h);
      if(bmp.close) bmp.close();
      var outType = isJpegPng ? (type==='image/jpg'?'image/jpeg':type) : 'image/png';
      var quality = outType==='image/jpeg' ? 0.86 : undefined;
      return new Promise(function(res){ canvas.toBlob(function(b){ res(b); }, outType, quality); })
        .then(function(outBlob){ return outBlob ? { blob:outBlob, type:outType, width:w, height:h } : { blob:file, type:file.type, width:w, height:h }; });
    }).catch(function(){ return { blob:file, type:file.type, width:null, height:null }; });
  }
  function makeImageKey(){ return 'img_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7); }
  function embedImageFile(file){
    var entry=currentEntry(); if(!entry||!file) return;
    processImageFile(file).then(function(res){
      var key=makeImageKey();
      return BoreStorage.saveImage(entry.title, key, res.blob, res.type, res.width, res.height).then(function(){
        var name=(file.name||'image').replace(/\.[a-z0-9]+$/i,'');
        return embedImageToken(key, name);
      });
    }).catch(function(){ /* image failed to save — leave the editor untouched */ });
  }
  function embedImageToken(key, name){
    var entry=currentEntry(); if(!entry) return Promise.resolve();
    if(state.editMode==='md'){ insertMd('\n!['+(name||'image')+'](#'+key+')\n'); scheduleSave(); return Promise.resolve(); }
    var body=$('body'); if(!body) return Promise.resolve();
    var fig=document.createElement('figure'); fig.setAttribute('contenteditable','false'); fig.setAttribute('data-token','#'+key);
    var im=document.createElement('img'); im.src='#'+key; im.alt=name||'image'; fig.appendChild(im);
    if(name){ var fc=document.createElement('figcaption'); fc.setAttribute('contenteditable','false'); fc.textContent=name; fig.appendChild(fc); }
    insertNodeAtCaret(fig); commitWysiwyg(); renderCard();
    scheduleSave();
    return resolveCardImages($('body'), entry.title);
  }

  /* ============================================================================
     CARD / DECK CRUD
     ========================================================================= */
  function addCard(){
    var entry=currentEntry(); if(!entry) return;
    var maxIdx = entry.cards.reduce(function(m,c){ return Math.max(m,c.idx||0); }, 0);
    var c={ idx:maxIdx+1, tag:'', title:'', body:'' };
    entry.cards.splice(state.active+1, 0, c); state.active++;
    scheduleSave(); renderSpines(); renderCard();
    var t=$('title'); if(t) t.focus();
  }
  function deleteCard(idx){
    var entry=currentEntry(); if(!entry || entry.cards.length<=1) return;
    entry.cards.splice(idx,1);
    if(state.active>=entry.cards.length) state.active=entry.cards.length-1;
    scheduleSave(); renderSpines(); renderCard();
  }
  function newDeck(){
    var title=prompt('Name this deck:','Untitled Deck'); if(title===null) return;
    title=title.trim()||'Untitled Deck';
    var existingTitles = deckTitles.map(function(d){ return d.title; });
    var final=title, n=2; while(existingTitles.indexOf(final)!==-1){ final=title+' '+n; n++; }
    var entry={ title:final, cards:[{idx:1,tag:'',title:'',body:''}], pos:1, addedAt:Date.now(), updatedAt:Date.now(), wrongLedger:[], supplements:[] };
    BoreStorage.saveDeck(entry).then(function(){ return refreshDeckTitles(); }).then(function(){
      cachedEntry = entry; state.deckTitle=final; state.active=0; state.editMode='visual';
      renderShell();
    });
  }

  /* ============================================================================
     IMPORT
     ========================================================================= */
  function parseDeckText(raw){ var t=raw.trim(); if(t.charAt(0)==='{'||t.charAt(0)==='['){ try{ return parseDeckJSON(t); }catch(e){} } return parseDeckMarkdown(raw); }
  function parseDeckJSON(raw){ var data=JSON.parse(raw), name='Imported deck', items=[]; if(Array.isArray(data)) items=data; else if(data&&typeof data==='object'){ name=data.title||data.deck||name; items=data.cards||data.slides||data.items||[]; }
    var cards=items.map(function(it,i){ return { idx:i+1, tag:(it.tag||it.section||'').trim(), title:(it.title||it.t||it.heading||it.name||'').trim(), body:(it.content||it.body||it.c||it.text||'').trim() }; }).filter(function(c){return c.title||c.body;});
    return { title:name, cards:cards }; }
  function parseDeckMarkdown(raw){ var name='Imported deck'; var h1=raw.match(/^#\s+(.+)$/m); if(h1) name=h1[1].trim();
    var body=raw.replace(/^#\s+.+$/m,''); var blocks=body.split(/\n\s*-{3,}\s*\n/); var cards=[]; var n=0;
    blocks.forEach(function(block){ var b=block.trim(); if(!b) return; var m=b.match(/^#{1,3}\s*(?:SLIDE\s*\d+\s*:\s*)?(.+)$/im); if(!m) return;
      var title=m[1].trim(); var rest=b.slice(m.index+m[0].length).trim(); var tag='';
      var tm=rest.match(/^<!--\s*tag:\s*(.+?)\s*-->\s*/i); if(tm){ tag=tm[1].trim(); rest=rest.slice(tm[0].length).trim(); }
      if(!title&&!rest) return; n++; cards.push({ idx:n, tag:tag, title:title, body:rest }); });
    return { title:name, cards:cards }; }
  function docxHtmlToDeck(html){ var dom=document.createElement('div'); dom.innerHTML=html; var name='Imported deck'; var h1=dom.querySelector('h1'); if(h1) name=h1.textContent.trim();
    var cards=[], cur=null, n=0;
    Array.prototype.forEach.call(dom.children, function(node){ var tag=node.tagName.toLowerCase(); if(tag==='h1') return;
      if(tag==='h2'||tag==='h3'){ if(cur) cards.push(cur); n++; cur={ idx:n, tag:'', title:node.textContent.trim(), body:'' }; return; }
      if(!cur){ n++; cur={ idx:n, tag:'', title:'', body:'' }; }
      var md=nodeToMdDocx(node); if(md) cur.body+=(cur.body?'\n\n':'')+md; });
    if(cur) cards.push(cur);
    cards.forEach(function(c){ var tm=c.body.match(/^<!--\s*tag:\s*(.+?)\s*-->\s*/i); if(tm){ c.tag=tm[1].trim(); c.body=c.body.slice(tm[0].length).trim(); } });
    return { title:name, cards:cards.filter(function(c){return c.title||c.body;}) }; }
  function nodeToMdDocx(node){ var tag=node.tagName?node.tagName.toLowerCase():''; if(node.nodeType===3) return node.textContent.trim();
    if(tag==='p') return inlineDocx(node);
    if(tag==='ul') return Array.prototype.map.call(node.children,function(li){return '- '+inlineDocx(li);}).join('\n');
    if(tag==='ol') return Array.prototype.map.call(node.children,function(li,i){return (i+1)+'. '+inlineDocx(li);}).join('\n');
    if(tag==='table') return docxTable(node);
    if(tag==='blockquote') return '> '+inlineDocx(node);
    return inlineDocx(node); }
  function inlineDocx(el){ var out=''; Array.prototype.forEach.call(el.childNodes, function(ch){ if(ch.nodeType===3){ out+=ch.textContent; return; }
    var t=ch.tagName.toLowerCase(), inner=inlineDocx(ch);
    if(t==='strong'||t==='b') out+='**'+inner+'**'; else if(t==='em'||t==='i') out+='*'+inner+'*'; else if(t==='a') out+='['+inner+']('+(ch.getAttribute('href')||'')+')'; else out+=inner; });
    return out.trim(); }
  function docxTable(table){ var rows=[]; Array.prototype.forEach.call(table.querySelectorAll('tr'), function(tr){ rows.push(Array.prototype.map.call(tr.children,function(td){return inlineDocx(td)||' ';})); });
    if(!rows.length) return ''; var header=rows[0]; var out=['| '+header.join(' | ')+' |','|'+header.map(function(){return '---';}).join('|')+'|']; rows.slice(1).forEach(function(r){ out.push('| '+r.join(' | ')+' |'); }); return out.join('\n'); }

  function openImport(){
    var m=$('modal'); m.classList.add('show');
    m.innerHTML='<div class="modal-box"><h3>Import a deck</h3><p class="msub">Load a <b>.md</b>/<b>.json</b> file, a Word <b>.docx</b>, or paste text. Occlusions as <code>{{answer}}</code> are kept.</p>'+
      '<button class="mbtn full" id="impFile">Choose a file (.md / .json / .docx)\u2026</button>'+
      '<div class="mlabel">or paste markdown / JSON</div>'+
      '<textarea class="mta" id="impText" placeholder="# Deck title&#10;&#10;---&#10;&#10;## Card title&#10;&#10;body with {{occlusion}}\u2026"></textarea>'+
      '<div class="mrow"><label class="mcheck"><input type="checkbox" id="impNew" checked> as a new deck</label></div>'+
      '<div class="mactions"><button class="mbtn" id="impCancel">Cancel</button><button class="mbtn prime" id="impGo">Import</button></div></div>';
    $('impCancel').onclick=closeModal; $('impFile').onclick=chooseImportFile;
    $('impGo').onclick=function(){ var raw=$('impText').value.trim(); if(!raw) return; commitImport(parseDeckText(raw), $('impNew').checked); };
    m.onclick=function(e){ if(e.target===m) closeModal(); };
  }
  function closeModal(){ var m=$('modal'); m.classList.remove('show'); m.innerHTML=''; }
  function chooseImportFile(){
    var input=document.createElement('input'); input.type='file'; input.accept='.md,.markdown,.txt,.json,.docx,application/json,text/markdown,text/plain';
    input.onchange=function(){ var f=input.files[0]; if(!f) return; var name=f.name.toLowerCase();
      if(name.endsWith('.docx')){ importDocx(f); } else { var r=new FileReader(); r.onload=function(){ $('impText').value=r.result; }; r.readAsText(f); } };
    input.click();
  }
  function importDocx(file){
    ensureMammoth(function(ok){ if(!ok){ alert('Could not load the .docx reader. Paste the text instead.'); return; }
      var r=new FileReader(); r.onload=function(){ window.mammoth.convertToHtml({arrayBuffer:r.result}).then(function(res){
        commitImport(docxHtmlToDeck(res.value), ($('impNew')?$('impNew').checked:true));
      }).catch(function(){ alert('Could not read that .docx.'); }); };
      r.readAsArrayBuffer(file); });
  }
  function ensureMammoth(cb){ if(window.mammoth) return cb(true); var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js'; s.onload=function(){ cb(!!window.mammoth); }; s.onerror=function(){ cb(false); }; document.head.appendChild(s); }
  function commitImport(deck, asNew){
    if(!deck||!deck.cards.length){ alert('No cards found in that file.'); return; }
    if(asNew){
      var existingTitles = deckTitles.map(function(d){ return d.title; });
      var final=deck.title||'Imported deck', n=2; while(existingTitles.indexOf(final)!==-1){ final=(deck.title||'Imported deck')+' '+n; n++; }
      var entry={ title:final, cards:deck.cards, pos:1, addedAt:Date.now(), updatedAt:Date.now(), wrongLedger:[], supplements:[] };
      BoreStorage.saveDeck(entry).then(function(){ return refreshDeckTitles(); }).then(function(){
        cachedEntry = entry; state.deckTitle=final; state.active=0;
        closeModal(); renderShell();
      });
    } else {
      var current=currentEntry(); if(!current){ closeModal(); return; }
      var maxIdx=current.cards.reduce(function(m,c){return Math.max(m,c.idx||0);},0);
      deck.cards.forEach(function(c,i){ current.cards.push({ idx:maxIdx+1+i, tag:c.tag||'', title:c.title||'', body:c.body||'' }); });
      BoreStorage.saveDeck(current).then(function(){ return refreshDeckTitles(); }).then(function(){
        closeModal(); renderShell();
      });
    }
  }

  /* ============================================================================
     EXPORT — expands image tokens back to full data-URLs (fetched from
     IndexedDB and converted), so the exported file is self-contained and
     drops straight into the reader on its own, with no IndexedDB dependency.
     ========================================================================= */
  function blobToDataUrl(blob){
    return new Promise(function(resolve, reject){
      var r=new FileReader();
      r.onload=function(){ resolve(r.result); };
      r.onerror=function(){ reject(r.error); };
      r.readAsDataURL(blob);
    });
  }
  function doExport(){
    var entry=currentEntry(); if(!entry){ return; }
    var keys=[]; var re=/\]\(#([a-zA-Z0-9_-]+)\)/g;
    entry.cards.forEach(function(c){ var m; re.lastIndex=0; while((m=re.exec(c.body||''))!==null){ if(keys.indexOf(m[1])===-1) keys.push(m[1]); } });
    var urlMap={};
    var chain=keys.reduce(function(p,key){
      return p.then(function(){
        return BoreStorage.getImage(entry.title, key).then(function(rec){
          if(rec && rec.blob) return blobToDataUrl(rec.blob).then(function(dataUrl){ urlMap[key]=dataUrl; });
        }).catch(function(){});
      });
    }, Promise.resolve());
    chain.then(function(){
      var md='# '+entry.title+'\n';
      entry.cards.forEach(function(c,i){
        md+='\n---\n\n## '+(c.title||('Card '+(i+1)))+'\n';
        if(c.tag) md+='<!-- tag: '+c.tag+' -->\n';
        var body=(c.body||'').replace(/\]\(#([a-zA-Z0-9_-]+)\)/g, function(m,k){ return '](' + (urlMap[k]||('#'+k)) + ')'; });
        md+='\n'+body+'\n';
      });
      var blob=new Blob([md],{type:'text/markdown'}), a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download=entry.title.replace(/[^\w\- ]+/g,'').replace(/\s+/g,'-')+'.md';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    });
  }

  /* ============================================================================
     PALETTE DRAG
     ========================================================================= */
  function wirePaletteDrag(pal){
    var grip=pal.querySelector('.pal-grip'); if(!grip) return;
    var dragging=false, ox=0, oy=0;
    function down(e){ dragging=true; var p=point(e), rect=pal.getBoundingClientRect(); ox=p.x-rect.left; oy=p.y-rect.top; pal.classList.add('dragging'); e.preventDefault(); }
    function move(e){ if(!dragging) return; var p=point(e), st=$('stage').getBoundingClientRect(); var x=p.x-st.left-ox, y=p.y-st.top-oy;
      x=Math.max(6,Math.min(st.width-56,x)); y=Math.max(6,Math.min(st.height-60,y)); state.palettePos={x:x,y:y}; pal.style.left=x+'px'; pal.style.top=y+'px'; pal.style.transform='none'; }
    function up(){ dragging=false; pal.classList.remove('dragging'); }
    function point(e){ return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY}; }
    grip.addEventListener('mousedown', down); document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
    grip.addEventListener('touchstart', down, {passive:false}); document.addEventListener('touchmove', move, {passive:false}); document.addEventListener('touchend', up);
  }

  /* ============================================================================
     GLOBAL WIRING
     ========================================================================= */
  var renameFromTitle=null, renameTimer=null;
  function flushRename(){
    clearTimeout(renameTimer);
    var entry=currentEntry(); if(!entry || renameFromTitle===null){ renameFromTitle=null; return Promise.resolve(); }
    var from=renameFromTitle, to=entry.title; renameFromTitle=null;
    if(from===to || !to || !to.trim()) return Promise.resolve();
    return BoreStorage.renameDeck(from, to).then(function(){ return refreshDeckTitles(); });
  }
  function wireShell(){
    var dn=$('deckName'); if(dn){ dn.addEventListener('input', function(){ var entry=currentEntry(); if(!entry) return;
      if(renameFromTitle===null) renameFromTitle=entry.title; // title as of when this rename-in-progress started
      entry.title=dn.value; state.deckTitle=entry.title; renderSpines();
      clearTimeout(renameTimer); renameTimer=setTimeout(flushRename, 500); });
      dn.addEventListener('blur', function(){ var entry=currentEntry(); if(entry && !entry.title.trim()){ entry.title='Untitled Deck'; dn.value=entry.title; state.deckTitle=entry.title; }
        flushRename(); }); }
    var ds=$('deckSelect'); if(ds) ds.onchange=function(){ flushRename().then(function(){ return switchToDeck(ds.value); }).then(function(){ state.active=0; state.editMode='visual'; renderShell(); }); };
    $('spines').addEventListener('click', function(e){
      var del=e.target.closest('.s-del'); if(del){ e.stopPropagation(); deleteCard(+del.dataset.del); return; }
      var s=e.target.closest('.spine'); if(s){ state.active=+s.dataset.i; renderSpines(); renderCard(); }
    });
    $('btnNewCard').onclick=addCard;
    $('btnNewDeck').onclick=newDeck;
    $('btnImport').onclick=openImport;
    $('btnExport').onclick=doExport;
    $('btnOpenReader').onclick=function(){ var entry=currentEntry(); if(!entry) return; localStorage.setItem(LAST_OPENED_KEY, entry.title); window.open('index.html','_blank'); };
    var msw=$('modeSwitch'); if(msw) msw.addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b) return;
      if(state.editMode==='visual'){ commitWysiwyg(); } else { var mta=$('mdArea'); if(mta) currentCard().body=mta.value; }
      state.editMode=b.dataset.em; renderShell(); });
    var pal=$('palette'); if(pal){ pal.addEventListener('mousedown', function(e){ if(!e.target.closest('.pal-grip')) e.preventDefault(); });
      pal.addEventListener('click', function(e){ var b=e.target.closest('.pal-btn'); if(b) dispatchCmd(b.dataset.cmd); }); wirePaletteDrag(pal); }
    var fb=$('floatbar'); fb.addEventListener('mousedown', function(e){ e.preventDefault(); }); fb.addEventListener('click', function(e){ var b=e.target.closest('.fb'); if(b) dispatchCmd(b.dataset.cmd); });
    var sm=$('slash'); sm.addEventListener('mousedown', function(e){ e.preventDefault(); }); sm.addEventListener('click', function(e){ var it=e.target.closest('.si'); if(!it) return; hideSlash(); dispatchCmd(it.dataset.b); });
  }

  document.addEventListener('selectionchange', updateFloatbar);
  document.addEventListener('click', function(e){ if(!e.target.closest('#slash')&&!e.target.closest('#body')) hideSlash(); });
  document.addEventListener('keydown', function(e){
    if((e.ctrlKey||e.metaKey)&&!e.altKey){
      if(e.key==='ArrowDown'){ e.preventDefault(); if(state.active<cards().length-1){ state.active++; renderSpines(); renderCard(); } }
      if(e.key==='ArrowUp'){ e.preventDefault(); if(state.active>0){ state.active--; renderSpines(); renderCard(); } }
    }
    if(e.key==='Escape') hideSlash();
  });

  /* ============================================================================
     INIT
     ========================================================================= */
  (function boot(){
    BoreStorage.migrateFromLocalStorage().catch(function(){}).then(function(){
      BoreStorage.requestPersistence();
      return refreshDeckTitles();
    }).then(function(){
      if(!deckTitles.length){
        var entry={ title:'Untitled Deck', cards:[{idx:1,tag:'',title:'',body:''}], pos:1, addedAt:Date.now(), updatedAt:Date.now(), wrongLedger:[], supplements:[] };
        return BoreStorage.saveDeck(entry).then(function(){ return refreshDeckTitles(); }).then(function(){ return entry.title; });
      }
      var lastOpened = localStorage.getItem(LAST_OPENED_KEY);
      var titles = deckTitles.map(function(d){ return d.title; });
      return (lastOpened && titles.indexOf(lastOpened)!==-1) ? lastOpened : deckTitles[0].title;
    }).then(function(title){
      return switchToDeck(title);
    }).then(function(){
      state.active=0;
      renderShell();
    });
  })();
})();

</script>
</body>
